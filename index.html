<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光影集 · 视频作品</title>
<meta name="description" content="短剧与自制影像作品集">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
  :root{
    --bg:#08080b;
    --card:#14141b;
    --line:rgba(255,255,255,.09);
    --text:#f4f4f7;
    --muted:#8c8c9c;
    --accent:#f6b73c;
    --accent-2:#ff5d5d;
    --radius:18px;
    --max:1240px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(246,183,60,.10), transparent 65%),
      radial-gradient(800px 600px at 90% 5%, rgba(255,93,93,.08), transparent 65%);
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  img,video{display:block;max-width:100%}

  /* ---------- Nav ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(20px,5vw,56px);
    background:rgba(8,8,11,.78);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#1a1205;font-size:14px;font-weight:800;
  }
  .nav-links{display:flex;align-items:center;gap:26px;font-size:14px;color:var(--muted)}
  .nav-links a{transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-links .gh{
    padding:8px 16px;border:1px solid var(--line);border-radius:999px;
    color:var(--text);transition:border-color .2s,background .2s;
  }
  .nav-links .gh:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.04)}

  /* ---------- Works ---------- */
  .works{
    max-width:var(--max);margin:0 auto;
    padding:64px clamp(20px,5vw,56px) 120px;
  }
  .section-head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;flex-wrap:wrap;
    padding-bottom:26px;margin-bottom:36px;
    border-bottom:1px solid var(--line);
  }
  .section-head h1{font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.03em}
  .section-head p{font-size:13px;color:var(--muted);margin-top:6px}
  .filters{display:flex;gap:10px;flex-wrap:wrap}
  .filters button{
    padding:9px 18px;border-radius:999px;border:1px solid var(--line);
    font-size:13px;color:var(--muted);
    transition:all .22s;
    display:inline-flex;align-items:center;gap:8px;
  }
  .filters button span{font-size:11px;opacity:.6}
  .filters button:hover{color:var(--text);border-color:rgba(255,255,255,.28)}
  .filters button.active{
    color:#1a1205;font-weight:700;
    background:linear-gradient(120deg,#ffd98a,var(--accent));
    border-color:transparent;
  }
  .filters button.active span{opacity:.65}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
    gap:24px;
  }
  .grid .empty{
    grid-column:1/-1;text-align:center;color:var(--muted);
    font-size:14px;padding:60px 0;
  }
  .card{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    cursor:pointer;
    transition:transform .35s cubic-bezier(.2,.7,.3,1),border-color .35s,box-shadow .35s;
    opacity:0;transform:translateY(26px);
  }
  .card.in{opacity:1;transform:translateY(0)}
  .card:hover{
    transform:translateY(-6px);
    border-color:rgba(246,183,60,.4);
    box-shadow:0 24px 50px -18px rgba(0,0,0,.85),0 0 0 1px rgba(246,183,60,.08);
  }
  .card.hide{display:none}

  .thumb{
    position:relative;aspect-ratio:16/9;overflow:hidden;background:#0d0d12;
  }
  .thumb .poster{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .6s,transform .7s cubic-bezier(.2,.7,.3,1);
  }
  .thumb .poster.ready{opacity:1}
  .card:hover .thumb .poster{transform:scale(1.05)}
  .thumb-fallback{
    position:absolute;inset:0;display:grid;place-items:center;
    background:
      radial-gradient(circle at 30% 20%,rgba(246,183,60,.16),transparent 60%),
      radial-gradient(circle at 80% 90%,rgba(255,93,93,.14),transparent 60%),
      #101016;
    font-size:clamp(2rem,5vw,3rem);font-weight:800;color:rgba(255,255,255,.16);
    letter-spacing:.1em;
  }
  .thumb-shade{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,8,11,.1) 0%,transparent 38%,rgba(8,8,11,.92) 100%);
    pointer-events:none;
  }
  .badge{
    position:absolute;z-index:2;
    font-size:11px;font-weight:600;letter-spacing:.04em;
    padding:4px 10px;border-radius:999px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .badge.cat{
    top:12px;left:12px;
    display:inline-flex;align-items:center;gap:6px;
    color:#fff;background:rgba(8,8,11,.55);border:1px solid rgba(255,255,255,.14);
  }
  .badge.cat i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .badge.cat[data-cat="自制"] i{background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
  .badge.dur{
    top:12px;right:12px;color:#e9e9f0;background:rgba(8,8,11,.55);
    font-variant-numeric:tabular-nums;
  }
  .card-title{
    position:absolute;z-index:2;left:16px;right:16px;bottom:14px;
  }
  .card-title h3{font-size:16px;font-weight:700;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .card-title p{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.1em;margin-top:2px}
  .play{
    position:absolute;z-index:3;left:50%;top:50%;
    width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transform:translate(-50%,-50%) scale(.82);
    opacity:0;transition:all .3s;
  }
  .play svg{width:18px;height:18px;fill:#fff;margin-left:2px}
  .card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .card:hover .play svg{fill:#1a1205}

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:40px clamp(20px,5vw,56px);
    max-width:var(--max);margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);
  }
  footer .foot-links{display:flex;gap:22px}
  footer a{transition:color .2s}
  footer a:hover{color:var(--accent)}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(16px,4vw,48px);
    background:rgba(4,4,6,.9);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;visibility:hidden;
    transition:opacity .3s,visibility .3s;
  }
  .modal.open{opacity:1;visibility:visible}
  .modal-inner{
    width:min(1100px,100%);
    transform:translateY(18px) scale(.98);
    transition:transform .35s cubic-bezier(.2,.7,.3,1);
  }
  .modal.open .modal-inner{transform:translateY(0) scale(1)}
  .modal-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:20px;margin-bottom:16px;
  }
  .modal-head h3{font-size:clamp(18px,2.2vw,24px);letter-spacing:-.01em}
  .modal-head p{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
  .modal-close{
    flex:none;width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    border:1px solid var(--line);background:rgba(255,255,255,.05);
    transition:background .2s,transform .2s;
  }
  .modal-close:hover{background:rgba(255,255,255,.14);transform:rotate(90deg)}
  .modal-close svg{width:16px;height:16px;stroke:#fff;stroke-width:2;fill:none}
  .modal video{
    width:100%;max-height:calc(100vh - 220px);
    border-radius:14px;background:#000;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
    outline:none;
  }

  /* ---------- Reveal ---------- */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.3,1)}
  .reveal.in{opacity:1;transform:translateY(0)}

  @media (max-width:640px){
    .nav-links a:not(.gh){display:none}
    .grid{gap:16px}
    .modal video{max-height:calc(100vh - 180px)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .card,.reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<header class="nav" id="top">
  <a class="brand" href="#top">
    <span class="brand-mark">影</span>
    <span>光影集</span>
  </a>
  <nav class="nav-links">
    <a href="#works">作品集</a>
    <a class="gh" href="https://github.com/znq1303" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  <section class="works" id="works">
    <div class="section-head">
      <div>
        <h1>视频作品</h1>
        <p>共 <span id="stat-total">10</span> 部 · 点击封面即可播放</p>
      </div>
      <div class="filters" id="filters">
        <button data-filter="all" class="active">全部 <span>10</span></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <p>© <span id="year"></span> 光影集 · 保留所有权利</p>
  <div class="foot-links">
    <a href="https://github.com/znq1303" target="_blank" rel="noopener">GitHub</a>
    <a href="#top">回到顶部</a>
  </div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="视频播放器">
  <div class="modal-inner">
    <div class="modal-head">
      <div>
        <h3 id="modal-title"></h3>
        <p id="modal-meta"></p>
      </div>
      <button class="modal-close" id="modal-close" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <video id="modal-video" controls playsinline preload="metadata"></video>
  </div>
</div>

<script src="videos.js"></script>
<script>
  const VIDEOS = window.VIDEOS || [];

  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  const modal = document.getElementById('modal');
  const modalVideo = document.getElementById('modal-video');
  const modalTitle = document.getElementById('modal-title');
  const modalMeta = document.getElementById('modal-meta');

  const srcOf = v => 'videos-web/' + encodeURIComponent(v.cat) + '/' + encodeURIComponent(v.file);
  const posterOf = v => srcOf(v).replace(/\.mp4$/i, '.jpg');
  const pad = n => String(Math.floor(n)).padStart(2, '0');
  const fmt = s => (isFinite(s) && s > 0) ? pad(s / 60) + ':' + pad(s % 60) : '--:--';

  /* ---------- 渲染卡片 ---------- */
  function renderCards() {
    VIDEOS.forEach((v, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.cat = v.cat;
    card.style.transitionDelay = (i % 6) * 45 + 'ms';
    card.innerHTML = `
      <div class="thumb">
        <div class="thumb-fallback">${v.title.slice(0, 1)}</div>
        <img class="poster" src="${posterOf(v)}" alt="${v.title}"
             onload="this.classList.add('ready')" onerror="this.remove()">
        <span class="badge cat" data-cat="${v.cat}"><i></i>${v.cat}</span>
        <span class="badge dur">${v.dur ? fmt(v.dur) : '--:--'}</span>
        <div class="thumb-shade"></div>
        <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="card-title">
          <h3>${v.title}</h3>
          <p>${v.cat}</p>
        </div>
      </div>`;
    grid.appendChild(card);

    card.addEventListener('click', () => openModal(v));
    });
    document.querySelectorAll('.card').forEach(c => io.observe(c));
  }

  /* ---------- 分类筛选 ---------- */
  function renderFilters() {
    const ORDER = ['自制', '短剧'];
    const cats = [...new Set(VIDEOS.map(v => v.cat))].sort((a, b) => {
      const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    cats.forEach(cat => {
      const b = document.createElement('button');
      b.dataset.filter = cat;
      b.innerHTML = `${cat} <span>${VIDEOS.filter(v => v.cat === cat).length}</span>`;
      filters.appendChild(b);
    });
    filters.querySelector('[data-filter="all"] span').textContent = VIDEOS.length;
    filters.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      filters.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      const f = btn.dataset.filter;
      document.querySelectorAll('.card').forEach(c => {
        const show = f === 'all' || c.dataset.cat === f;
        c.classList.toggle('hide', !show);
        if (show) { c.classList.remove('in'); requestAnimationFrame(() => c.classList.add('in')); }
      });
    });
  }

  /* ---------- 播放弹窗 ---------- */
  function openModal(v) {
    modalTitle.textContent = v.title;
    modalMeta.textContent = v.cat + ' · 全屏观看';
    modalVideo.src = srcOf(v);
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    modalVideo.play().catch(() => {});
  }
  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    modalVideo.pause();
    modalVideo.removeAttribute('src');
    modalVideo.load();
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

  /* ---------- 滚动动画 ---------- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

  /* ---------- 加载作品清单 ---------- */
  function render() {
    if (!VIDEOS.length) {
      grid.innerHTML = '<p class="empty">暂无作品</p>';
      return;
    }
    renderCards();
    renderFilters();
    document.getElementById('stat-total').textContent = VIDEOS.length;
  }

  if (VIDEOS.length) {
    render();
  } else {
    grid.innerHTML = '<p class="empty">作品清单为空，请运行 tools\\build_videos.py 生成</p>';
  }

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
